name: Build Firmware
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: pio run -e cyd2usb
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/cyd2usb/firmware.bin
            .pio/build/cyd2usb/bootloader.bin
            .pio/build/cyd2usb/partitions.bin
